name: Cleanup Feature Deployment

on:
  pull_request:
    types: [closed]
    branches:
      - develop
      - main
  delete:

jobs:
  cleanup:
    name: Remove Branch Deployment (PR merged)
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true && github.head_ref != 'main' && github.head_ref != 'develop'

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Delete feature deployment
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          DO_SPACES_BUCKET: ${{ vars.DO_SPACES_BUCKET }}
          DO_SPACES_ENDPOINT: ${{ vars.DO_SPACES_ENDPOINT }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_ACTIONS: 'true'
        run: node deploy/cleanup-feature.js

      - name: Comment on PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const sanitizedBranch = branch.replace(/[^a-zA-Z0-9-_/]/g, '-').toLowerCase();

            const comment = `## 🧹 Branch Deployment Cleaned Up

            The deployment for \`${branch}\` has been removed from Digital Ocean Spaces.

            **Removed path:** \`cxone-expert-enhancements/${sanitizedBranch}/\`

            This cleanup happened automatically because the PR was merged to \`${context.payload.pull_request.base.ref}\`.
            `;

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });

  cleanup-deleted-branch:
    name: Remove Branch Deployment (branch deleted)
    runs-on: ubuntu-latest
    if: github.event_name == 'delete' && github.event.ref_type == 'branch' && github.event.ref != 'main' && github.event.ref != 'develop'

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Delete feature deployment for deleted branch
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          DO_SPACES_BUCKET: ${{ vars.DO_SPACES_BUCKET }}
          DO_SPACES_ENDPOINT: ${{ vars.DO_SPACES_ENDPOINT }}
          GITHUB_ACTIONS: 'true'
        run: node deploy/cleanup-feature.js "${{ github.event.ref }}"
