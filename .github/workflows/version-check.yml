name: Version Check

on:
  workflow_call:
    inputs:
      base_ref:
        required: true
        type: string
      head_ref:
        required: true
        type: string
      fail_on_match:
        required: false
        type: boolean
        default: true
    outputs:
      changed:
        description: "true if the version differs between head and base"
        value: ${{ jobs.check-version.outputs.changed }}

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_ref }}
          fetch-depth: 0

      - name: Determine head version
        id: head_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Head version: $VERSION"

      - name: Determine base version
        id: base_version
        run: |
          git checkout ${{ inputs.base_ref }}
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Base version: $VERSION"

      - name: Compare versions
        id: compare
        run: |
          HEAD_VERSION="${{ steps.head_version.outputs.version }}"
          BASE_VERSION="${{ steps.base_version.outputs.version }}"
          echo "Head: $HEAD_VERSION"
          echo "Base: $BASE_VERSION"

          if [ "$HEAD_VERSION" = "$BASE_VERSION" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            if [ "${{ inputs.fail_on_match }}" = "true" ]; then
              echo "❌ Version has not been bumped (still $HEAD_VERSION)"
              exit 1
            else
              echo "⚠️ Version unchanged; continuing (non-blocking)"
            fi
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "✅ Version bumped from $BASE_VERSION to $HEAD_VERSION"
          fi
