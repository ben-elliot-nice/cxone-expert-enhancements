name: Deploy Feature Branch

on:
  push:
    branches-ignore:
      - main
      - develop

jobs:
  deploy:
    name: Deploy Feature Branch
    uses: ./.github/workflows/deploy-reusable.yml
    secrets: inherit
    with:
      branch_name: ${{ github.ref_name }}

  comment:
    name: Comment on PR
    if: github.event_name == 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Post deployment comment
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const sanitizedBranch = branch.replace(/[^a-zA-Z0-9-_/]/g, '-').toLowerCase();
            const baseUrl = 'https://${{ vars.DO_SPACES_BUCKET }}.${{ vars.DO_SPACES_ENDPOINT }}/cxone-expert-enhancements';
            const embedUrl = `${baseUrl}/${sanitizedBranch}/embed.js`;

            const comment = `## 🚀 Branch Deployment Successful

            **Branch:** \`${branch}\`
            **Deployment Path:** \`cxone-expert-enhancements/${sanitizedBranch}/\`

            ### Usage

            \`\`\`html
            <script src="${embedUrl}"></script>
            \`\`\`

            ### Files
            - [embed.js](${embedUrl})
            - [core.css](${baseUrl}/${sanitizedBranch}/core.css)
            `;

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });
