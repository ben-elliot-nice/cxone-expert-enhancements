name: Test Suite

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: unit-coverage

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration

  version-check-required:
    name: Version Check (Required)
    if: github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'develop'
    uses: ./.github/workflows/version-check.yml
    with:
      base_ref: origin/${{ github.base_ref }}
      head_ref: ${{ github.head_ref }}
      fail_on_match: true

  version-check-warning:
    name: Version Check (Warning)
    if: github.event_name == 'pull_request' && github.base_ref == 'develop'
    uses: ./.github/workflows/version-check.yml
    with:
      base_ref: origin/${{ github.base_ref }}
      head_ref: ${{ github.head_ref }}
      fail_on_match: false

  e2e-tests:
    name: E2E Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Compute deployment slug
        id: slug
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          SLUG=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9\-_\/]/-/g')
          echo "DEPLOYMENT_BRANCH_SLUG=$SLUG" >> $GITHUB_ENV
          echo "DEPLOYMENT_BRANCH_SLUG=$SLUG"

      - name: Wait for feature deploy (branch artifact)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "Waiting for feature-deploy run on branch $BRANCH matching SHA $TARGET_SHA"
          for i in {1..30}; do
            RUN=$(gh run list --workflow=feature-deploy.yml --branch="$BRANCH" --limit=1 --json headSha,status,conclusion,databaseId --jq '.[0]')
            STATUS=$(echo "$RUN" | jq -r '.status // ""')
            CONCLUSION=$(echo "$RUN" | jq -r '.conclusion // ""')
            HEAD_SHA=$(echo "$RUN" | jq -r '.headSha // ""')
            RUN_ID=$(echo "$RUN" | jq -r '.databaseId // ""')

            echo "Latest deploy: status=$STATUS conclusion=$CONCLUSION head=$HEAD_SHA run_id=$RUN_ID"

            if [ -z "$RUN_ID" ]; then
              echo "No feature-deploy run found yet. Sleeping..."
              sleep 10
              continue
            fi

            if [ "$HEAD_SHA" != "$TARGET_SHA" ]; then
              echo "Latest deploy is for a different SHA ($HEAD_SHA). Sleeping for next run..."
              sleep 10
              continue
            fi

            if [ "$STATUS" = "completed" ] && [ "$CONCLUSION" = "success" ]; then
              echo "Deploy for current SHA is complete."
              exit 0
            fi

            if [ "$STATUS" = "completed" ] && [ "$CONCLUSION" != "success" ]; then
              echo "Latest deploy failed (conclusion=$CONCLUSION)."
              exit 1
            fi

            echo "Deploy in progress... waiting"
            sleep 10
          done

          echo "Timed out waiting for feature-deploy for SHA $TARGET_SHA"
          exit 1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run E2E tests
        run: npm run test:e2e -- --project=${{ matrix.browser }}
        env:
          CI: 'true'
          BASE_URL: http://localhost:8080/test-page.html
          DO_SPACES_BUCKET: ${{ vars.DO_SPACES_BUCKET }}
          DO_SPACES_ENDPOINT: ${{ vars.DO_SPACES_ENDPOINT }}
          DEPLOYMENT_BRANCH_SLUG: ${{ env.DEPLOYMENT_BRANCH_SLUG }}

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, e2e-tests]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "Unit Tests: ${{ needs.unit-tests.result }}"
          echo "Integration Tests: ${{ needs.integration-tests.result }}"
          echo "E2E Tests: ${{ needs.e2e-tests.result }}"

          if [[ "${{ needs.unit-tests.result }}" != "success" ]] || \
             [[ "${{ needs.integration-tests.result }}" != "success" ]] || \
             [[ "${{ needs.e2e-tests.result }}" != "success" ]]; then
            echo "❌ Some tests failed"
            exit 1
          fi

          echo "✅ All tests passed"

  pr-comment:
    name: PR Test Results Comment
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, e2e-tests]
    if: github.event_name == 'pull_request' && always()

    steps:
      - name: Create test results comment
        uses: actions/github-script@v6
        env:
          DO_SPACES_BUCKET: ${{ vars.DO_SPACES_BUCKET }}
          DO_SPACES_ENDPOINT: ${{ vars.DO_SPACES_ENDPOINT }}
          CDN_BASE_URL: ${{ vars.CDN_BASE_URL }}
        with:
          script: |
            const unitResult = '${{ needs.unit-tests.result }}';
            const integrationResult = '${{ needs.integration-tests.result }}';
            const e2eResult = '${{ needs.e2e-tests.result }}';
            const slug = '${{ github.head_ref || github.ref_name }}'.toLowerCase().replace(/[^a-z0-9-_\/]/g, '-');
            const fallbackBase = `https://${process.env.DO_SPACES_BUCKET}.${process.env.DO_SPACES_ENDPOINT}/cxone-expert-enhancements`;
            const baseUrl = process.env.CDN_BASE_URL || fallbackBase;
            const deployUrl = `${baseUrl}/${slug}/embed.js`;

            const icon = (result) => {
              switch (result) {
                case 'success': return '✅';
                case 'failure': return '❌';
                case 'cancelled': return '🚫';
                case 'skipped': return '⏭️';
                default: return '❔';
              }
            };

            const comment = `## Test Results

            | Test Type | Result |
            |-----------|--------|
            | Unit Tests | ${icon(unitResult)} ${unitResult} |
            | Integration Tests | ${icon(integrationResult)} ${integrationResult} |
            | E2E Tests | ${icon(e2eResult)} ${e2eResult} |

            ${unitResult === 'success' && integrationResult === 'success' && e2eResult === 'success' ?
              '🎉 All tests passed! Ready to merge.' :
              '⚠️ Some tests failed. Please review the results above.'}

            **Deployed embed:** ${deployUrl || 'n/a'}

            [View detailed workflow results](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
